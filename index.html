<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Смена — Новосибирск</title>
<meta name="theme-color" content="#0A1220" />
<meta name="color-scheme" content="dark" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Смена" />
<!-- Внешний вид: цвета, шрифт, кнопки, карточки — всё в ui.css -->
<link rel="stylesheet" href="ui.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // те же цвета, что названы в ui.css — чтобы работали классы вида text-gold, bg-deck
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          night: "#0A1220",
          hull: "#101A2C",
          deck: "#17233A",
          rivet: { DEFAULT: "#223150", hi: "#32456B" },
          chalk: "#EEF2F8",
          ash: "#9AA8BF",
          mute: "#66758F",
          gold: { DEFAULT: "#D9A441", hi: "#EBC46F", lo: "#BE8B2B" },
          signal: "#3FBF7F",
          flare: "#E86A54",
        },
        fontFamily: {
          sans: ["Geologica", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Arial", "sans-serif"],
        },
      },
    },
  };
</script>
<!-- ВАЖНО: версия Firebase та же (9.23.0), что в Досатуе и Табеле. Все три
     приложения живут на одном адресе и делят один офлайн-кэш базы; если
     здесь поставить версию новее, у двух других сломается работа без сети. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
</head>
<body class="min-h-screen pb-24">

  <div id="auth-screen">
    <!-- заглушка до загрузки: без неё при плохой связи был бы пустой экран -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A1220;color:rgba(238,242,248,.55);font-size:14px;">Загрузка…</div>
  </div>

  <div id="app-shell" class="hidden">
    <header class="topbar">
      <div class="max-w-md mx-auto">
        <div id="user-bar"></div>
        <div id="header-hero"></div>
      </div>
    </header>

    <main id="app" class="max-w-md mx-auto px-3 mt-4 space-y-3"></main>

    <nav id="nav" class="nav"></nav>
  </div>

  <script src="firebase-config.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
  <script src="lists.js"></script>
  <script src="install.js"></script>
  <script src="outbox.js"></script>
  <script src="shifts.js"></script>
  <script src="xl-sheet.js"></script>
  <script src="manager.js"></script>
  <script src="people.js"></script>
  <script src="catalog.js"></script>
  <script src="money.js"></script>
  <script src="chat.js"></script>
  <script src="notifications.js"></script>
  <script src="auth.js"></script>
</body>
</html>
